[workspace]
members = [
  "crates/gareji-board-app",
  "crates/gareji-board-bridge",
  "crates/gareji-board-core",
  "crates/gareji-board-domain",
  "crates/gareji-board-runner",
  "crates/gareji-board-store",
  "xtask",
]
default-members = [
  "crates/gareji-board-bridge",
  "crates/gareji-board-core",
  "crates/gareji-board-domain",
  "crates/gareji-board-runner",
  "crates/gareji-board-store",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Gareji-AI/gareji-board"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
directories = "6.0.0"
gareji-board-domain = { path = "crates/gareji-board-domain" }
gareji-board-runner = { path = "crates/gareji-board-runner" }
gareji-board-bridge = { path = "crates/gareji-board-bridge" }
gareji-board-core = { path = "crates/gareji-board-core" }
gareji-board-store = { path = "crates/gareji-board-store" }
jsonschema = { version = "0.48.0", default-features = false }
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt", "time"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
